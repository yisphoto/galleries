<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gallery</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#1a1a1a;--bg:#fff;--ink:#141414;--muted:#808080;--line:#ebebeb;--soft:#f5f4f2;--heart:#d9445a;
  --serif:'Frank Ruhl Libre',Georgia,'Times New Roman',serif;--sans:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--bar:64px;--wm:none}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
.boot{min-height:100vh;display:grid;place-items:center}
.spinner{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ───── cover ───── */
.cover{position:relative;height:100vh;height:100svh;min-height:460px;overflow:hidden;color:#fff;background:#151515}
.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.05);transition:opacity 1.4s ease,transform 9s ease}
.cover-bg.ready{opacity:1;transform:scale(1)}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 100%);pointer-events:none}
.cover-brand{position:absolute;top:28px;inset-inline:0;z-index:2;display:flex;justify-content:center}
.cover-brand .name{font-size:13px;letter-spacing:.3em;text-transform:uppercase;font-weight:400}
.cover-brand .logo{height:var(--logo-h,120px);max-width:min(72vw,560px);object-fit:contain;filter:drop-shadow(0 1px 8px rgba(0,0,0,.35))}
@media(max-width:700px){.cover-brand .logo{height:calc(var(--logo-h,120px) * .7)}}
.cover-text{position:absolute;inset-inline:0;bottom:13vh;z-index:2;text-align:center;padding:0 24px;animation:fade 1s .3s both}
.cover h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,6.4vw,84px);line-height:1.05}
.cover .sub{margin-top:16px;font-size:14px;letter-spacing:.14em;opacity:.92;font-weight:400}
.btn-ghost{display:inline-block;margin-top:34px;padding:14px 36px;border:1px solid rgba(255,255,255,.85);font-size:13px;letter-spacing:.18em;font-weight:400;transition:background .25s,color .25s}
.btn-ghost:hover{background:#fff;color:#111}
.cover-down{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:2;color:#fff;opacity:.75;animation:bob 2.2s infinite}
.cover-down svg{width:26px;height:26px}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}

/* ───── top bar ───── */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 clamp(12px,3vw,40px)}
.bar-logo{height:34px;max-width:130px;object-fit:contain}
.bar-title{flex:1;min-width:0;padding-inline-start:4px}
.bar-title b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title span{display:block;font-size:12px;color:var(--muted)}
.ibtn{position:relative;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-size:14px;font-weight:400;transition:background .2s,color .2s;white-space:nowrap}
.ibtn:hover{background:var(--soft)}
.ibtn svg{width:20px;height:20px;flex:none}
.ibtn.on{color:var(--heart)}
.ibtn.on svg path{fill:currentColor}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--heart);color:#fff;font-size:11px;font-weight:500;display:inline-grid;place-items:center}
.badge:empty{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 clamp(12px,3vw,40px) 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:6px 15px;border-radius:999px;font-size:14px;color:var(--muted);border:1px solid var(--line);transition:.2s}
.tab:hover,.tab.on{color:var(--ink);border-color:#d8d8d8;background:var(--soft)}
@media(max-width:700px){.ibtn .lbl{display:none}.ibtn{padding:0 10px}.bar-logo{display:none}}

.intro{max-width:660px;margin:60px auto 10px;padding:0 24px;text-align:center;font-family:var(--serif);font-size:19px;line-height:1.85;color:#444;white-space:pre-line}

/* ───── grid ───── */
.main{padding:30px clamp(6px,2vw,40px) 90px;min-height:50vh}
.sec{margin-bottom:60px;scroll-margin-top:calc(var(--bar) + 60px)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;margin:0 6px 18px}
.sec-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.6vw,30px)}
.sec-head .meta{font-size:13px;color:var(--muted)}
.sec-head .meta a{text-decoration:underline;text-underline-offset:3px}
.jrow{display:flex}
.tile{position:relative;flex:none;overflow:hidden;background:var(--soft);cursor:zoom-in}
.tile img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease,transform .7s ease}
.tile.ready img{opacity:1}
@media(hover:hover){.tile:hover img{transform:scale(1.03)}}
.wm .tile::after{content:'';position:absolute;inset:0;background-image:var(--wm);background-size:240px auto;pointer-events:none}
.tile .acts{position:absolute;inset-inline-end:8px;bottom:8px;z-index:2;display:flex;gap:6px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.tile:hover .acts,.tile.is-fav .acts{opacity:1;transform:none}
.act{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,20,.38);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s,background .2s}
.act:hover{background:rgba(20,20,20,.6)}
.act:active{transform:scale(.9)}
.act svg{width:17px;height:17px}
.tile.is-fav .act-fav{background:#fff;color:var(--heart)}
.tile.is-fav .act-fav svg path{fill:currentColor}
.tile:not(.is-fav) .act-fav~.act{}
/* בטלפון: הכפתורים מוסתרים, ונגיעה בתמונה חושפת אותם (נגיעה שנייה פותחת את התמונה) */
@media(hover:none){
  .tile .acts{opacity:0;transform:translateY(4px);pointer-events:none;inset-inline-end:6px;bottom:6px;gap:5px}
  .tile.show-acts .acts{opacity:1;transform:none;pointer-events:auto}
  .tile.is-fav:not(.show-acts) .acts{opacity:1;transform:none;pointer-events:auto}
  .tile.is-fav:not(.show-acts) .act:not(.act-fav){display:none}
  .act{width:30px;height:30px}
  .act svg{width:15px;height:15px}
}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;pointer-events:none;z-index:1}
.tile .play svg{width:54px;height:54px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4))}
.nodl img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}}

.favbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin:0 6px 24px;padding:18px 22px;background:var(--soft);border-radius:16px}
.favbar .count{font-family:var(--serif);font-size:22px}
.favbar .sm{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:#2e7d4f}
.favbar .sm svg{width:15px;height:15px}
.fb-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;font-weight:400;transition:opacity .2s,transform .1s}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn svg{width:18px;height:18px}
.empty{text-align:center;padding:90px 20px;color:var(--muted)}
.empty svg{width:40px;height:40px;margin:0 auto 16px;stroke-width:1.2}
.empty h3{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink);margin-bottom:8px}

.foot{border-top:1px solid var(--line);padding:56px 24px 64px;text-align:center}
.foot .name{font-family:var(--serif);font-size:24px;font-weight:400}
.foot .logo{height:min(var(--logo-h,120px),110px);max-width:min(70vw,360px);object-fit:contain;margin:0 auto}
.foot .tag{margin-top:6px;color:var(--muted);font-size:14px}
.foot .links{margin-top:20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.foot .links a{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s}
.foot .links a:hover{background:var(--soft)}
.foot .links svg{width:18px;height:18px}

/* ───── lightbox ───── */
#lb{position:fixed;inset:0;z-index:100;background:#0d0d0d;color:#fff;display:none;user-select:none;-webkit-user-select:none}
#lb.open{display:block;animation:lbIn .25s ease}
@keyframes lbIn{from{opacity:0}}
.lb-top{position:absolute;top:0;inset-inline:0;height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px;z-index:4}
.lb-count{font-size:13px;opacity:.7;padding:0 10px;direction:ltr;font-variant-numeric:tabular-nums}
.lb-name{flex:1;text-align:center;font-size:13px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
#lb .ibtn:hover{background:rgba(255,255,255,.1)}
.lb-stage{position:absolute;inset:60px 70px 76px;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity .2s;transform-origin:50% 50%;will-change:transform;cursor:zoom-in}
.lb-stage img.zoomed{cursor:grab}
.lb-stage img.anim{transition:transform .25s ease,opacity .2s}
.lb-stage iframe{width:100%;height:100%;border:0}
.lb-wm{position:absolute;inset:60px 70px 76px;background-image:var(--wm);background-size:300px auto;pointer-events:none;z-index:2}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;opacity:.6;transition:opacity .2s,background .2s}
.lb-nav:hover{opacity:1;background:rgba(255,255,255,.08)}
.lb-nav svg{width:30px;height:30px;stroke-width:1.3}
.lb-l{left:8px}.lb-r{right:8px}
.lb-bottom{position:absolute;bottom:0;inset-inline:0;height:76px;display:flex;align-items:center;justify-content:center;gap:6px;z-index:4}
.lb-bottom .ibtn.on{color:var(--heart)}
.dot{position:absolute;top:8px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:var(--heart)}
@media(max-width:700px){.lb-nav{display:none}.lb-stage,.lb-wm{inset:56px 0 70px}.lb-name{display:none}}

/* ───── modal / toast ───── */
#modal{position:fixed;inset:0;z-index:200;background:rgba(12,12,12,.5);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal.open{display:flex;animation:lbIn .2s ease}
.card{background:#fff;color:var(--ink);border-radius:20px;max-width:430px;width:100%;max-height:calc(100vh - 36px);overflow:auto;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:fade .25s ease}
.card h3{font-family:var(--serif);font-weight:400;font-size:26px;margin-bottom:6px}
.card p{color:var(--muted);font-size:14px;line-height:1.65;margin-bottom:18px}
.field{display:block;width:100%;padding:12px 14px;border:1px solid #e0e0e0;border-radius:12px;font:inherit;font-size:16px;margin-bottom:10px;background:#fff;color:var(--ink);outline:none;transition:border-color .2s}
.field:focus{border-color:#999}
textarea.field{min-height:100px;resize:vertical;line-height:1.5}
.row-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.dl-list{display:flex;flex-direction:column;gap:8px}
.dl-list .btn{justify-content:space-between}
.cmt{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.55;margin-bottom:8px;white-space:pre-wrap}
.cmt-l{font-size:12px;color:var(--muted);margin-bottom:6px}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .3s}
.prog-t{font-size:13px;color:var(--muted);direction:rtl;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:4px;justify-content:center;margin:4px 0 14px;direction:ltr}
.stars button{width:40px;height:40px;color:#d6d3ce;transition:transform .1s,color .15s}
.stars button svg{width:32px;height:32px;margin:auto}
.stars button.on{color:#f2b01e}
.stars button:active{transform:scale(.88)}
.rev h3,.rev>p{text-align:center}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,16px);background:#161616;color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:300;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.busy{display:flex;align-items:center;gap:10px;padding:16px 26px;font-size:16px;bottom:50%;transform:translate(-50%,50%);border-radius:16px}
.tspin{width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex:none}

/* ───── lock & messages ───── */
.lock{position:fixed;inset:0;display:grid;place-items:center;background:#141414;color:#fff;overflow:hidden}
.lock .bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(22px) brightness(.5);opacity:0;transition:opacity 1s}
.lock .bg.ready{opacity:1}
.lock .box{position:relative;text-align:center;width:min(360px,88vw);animation:fade .6s ease}
.lock .ic{width:46px;height:46px;margin:0 auto 18px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center}
.lock .ic svg{width:20px;height:20px}
.lock h1{font-family:var(--serif);font-weight:300;font-size:clamp(32px,5vw,44px);line-height:1.1;margin-bottom:8px}
.lock p{opacity:.75;font-size:14px;margin-bottom:26px}
.lock input{width:100%;padding:14px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:16px;text-align:center;outline:none}
.lock input::placeholder{color:rgba(255,255,255,.55)}
.lock input:focus{border-color:rgba(255,255,255,.7)}
.lock button{margin-top:12px;width:100%;padding:14px;border-radius:999px;background:#fff;color:#111;font-weight:500}
.lock .err{min-height:20px;margin-top:14px;font-size:13px;color:#ffb7b7}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.msg .brand{margin-bottom:44px}
.msg .brand .name{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.msg .brand .logo{height:min(var(--logo-h,120px),110px);max-width:min(70vw,360px);object-fit:contain}
.msg h1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,4.5vw,42px);margin-bottom:10px}
.msg p{color:var(--muted);font-size:15px;line-height:1.6}
html[lang=he] .cover-brand .name,html[lang=he] .msg .brand .name{letter-spacing:.04em;text-transform:none;font-size:15px}
html[lang=he] .cover .sub,html[lang=he] .btn-ghost{letter-spacing:.02em}
</style>
</head>
<body>
<div id="app"><div class="boot"><div class="spinner"></div></div></div>
<div id="lb"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="config.js"></script>

async function init() {

  st.visitor = loadVisitor();
  if (!CFG.API_URL || /PASTE/.test(CFG.API_URL)) return showMsg('Setup', 'config.js → API_URL');
  if (!SLUG) {
    showMsg(L.homeTitle, L.homeSub);
    try { applySettings(await api('getSettings')); document.title = S.studioName || 'Gallery'; showMsg(L.homeTitle, L.homeSub); } catch (e) {}
    return;
  }
  st.token = store.get('gt_' + SLUG) || '';
  const viewKey = 'gv_' + SLUG;
  const count = !sstore.get(viewKey);
  let r;
  try { r = await api('getGallery', SLUG, st.token, count); }
  catch (e) { return showMsg(L.error, String(e && e.message || e)); }
  applySettings(r.settings);
  if (r.meta) { setLang(r.meta.lang); document.title = (r.meta.title || 'Gallery') + (S.studioName ? ' | ' + S.studioName : ''); }
  if (r.error) {
    const m = { notfound:[L.notfound, L.notfoundSub], expired:[L.expired, L.contact], unavailable:[L.unavailable, L.contact] }[r.error] || [L.error, ''];
    return showMsg(m[0], m[1]);

  if (r.locked) return showLock(r.meta);
  if (count) sstore.set(viewKey, '1');
  start(r);
}

function showLock(meta) {

  const bg = $('.lock .bg');

  $('#lockf').onsubmit = async e => {
    e.preventDefault();
    const pw = $('#pw').value; if (!pw) return;

      ${n ? `<button class="btn" data-a="submit">${esc(st.submittedAt ? L.resubmit : L.submit)}</button>` : ''}</div>`;
  d.querySelector('[data-a=back]').onclick = () => setView('all');
  const df = d.querySelector('[data-a=dlfav]');
  if (df) df.onclick = () => { const items = st.items.filter(it => st.favs.has(it.id)); MOBILE || !HAS_KEY ? saveFavsPhone(items) : downloadZip(items, st.meta.title + ' - ' + L.favorites, false); };
  const sb = d.querySelector('[data-a=submit]'); if (sb) sb.onclick = submitSelection;

}

/* ───── justified layout ───── */
let lastW = 0, layoutT;
function scheduleLayout() { clearTimeout(layoutT); layoutT = setTimeout(layoutAll, 120); }
window.addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) > 2) scheduleLayout(); });
function layoutAll() { document.querySelectorAll('.grid').forEach(g => layoutGrid(g, g._items || [])); lastW = innerWidth; }

function layoutGrid(grid, items) {
  const W = grid.clientWidth; if (!W) return;
  const k = GRID_H[S.gridSize] || 1;
  const target = (W < 520 ? 150 : W < 900 ? 210 : W < 1400 ? 270 : 320) * k;
  const g0 = GRID_GAP[S.gridGap] != null ? GRID_GAP[S.gridGap] : 8;
  const gap = W < 520 ? Math.round(g0 * 0.5) : g0;
  const frag = document.createDocumentFragment();
  let row = [], sum = 0;
  const flush = last => {
    if (!row.length) return;
    let h = (W - gap * (row.length - 1)) / sum;
    if (last && h > target * 1.25) h = target;
    const r = document.createElement('div'); r.className = 'jrow'; r.style.gap = gap + 'px'; r.style.marginBottom = gap + 'px';
    row.forEach(it => { sizeTile(it, it._ar * h, h); r.appendChild(it._el); });
    frag.appendChild(r); row = []; sum = 0;
  };
  items.forEach(it => {
    it._ar = Math.min(Math.max(it.w / it.h, 0.3), 3.5);
    row.push(it); sum += it._ar;
    if (sum * target + gap * (row.length - 1) >= W) flush(false);
  });
  flush(true);
  grid.textContent = ''; grid.appendChild(frag);
}

function tileFor(it) {
  if (it._el) return it._el;
  const m = st.meta;
  const el = document.createElement('div');
  el.className = 'tile' + (st.favs.has(it.id) ? ' is-fav' : '');
  const img = document.createElement('img');
  img.alt = ''; img.loading = 'lazy'; img.decoding = 'async'; img.draggable = false;
  img.addEventListener('load', () => { el.classList.add('ready'); fixRatio(it, img); });
  el.appendChild(img);
  if (it.v) el.insertAdjacentHTML('beforeend', `<span class="play">${ic('play')}</span>`);
  let acts = '';
  if (m.allowFavorites) acts += `<button class="act act-fav" data-a="fav" aria-label="${esc(L.fav)}">${ic('heart')}</button>`;
  if (m.allowDownload) acts += `<button class="act act-dl" data-a="dl" aria-label="${esc(L.download)}">${ic('download')}</button>`;
  if (acts) el.insertAdjacentHTML('beforeend', `<div class="acts">${acts}</div>`);
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-a]');
    if (a) { e.stopPropagation(); a.dataset.a === 'fav' ? toggleFav(it, a) : download(it); revealActs(el); return; }
    if (acts && TOUCH() && !el.classList.contains('show-acts')) { revealActs(el); return; }
    openLb(it);
  });
  it._el = el; it._img = img;
  return el;
}

const TOUCH = () => matchMedia('(hover:none)').matches;
let actsEl = null, actsT;
function revealActs(el) {
  if (!TOUCH()) return;
  if (actsEl && actsEl !== el) actsEl.classList.remove('show-acts');
  actsEl = el; el.classList.add('show-acts');
  clearTimeout(actsT); actsT = setTimeout(() => { el.classList.remove('show-acts'); if (actsEl === el) actsEl = null; }, 4000);
}

function sizeTile(it, w, h) {
  const el = tileFor(it);
  el.style.width = w.toFixed(2) + 'px'; el.style.height = h.toFixed(2) + 'px';
  const b = Math.min(2000, Math.max(400, Math.ceil(w * dpr() / 400) * 400));
  if (!it._b || b > it._b) { it._b = b; setImg(it._img, it.id, b); }
}

// אם הממדים מהדרייב לא תואמים לתמונה בפועל (למשל צילום לאורך) — מתקנים ומסדרים מחדש
function fixRatio(it, img) {
  if (it._fixed) return; it._fixed = 1;
  const nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh) return;
  const r = it.w / it.h, nr = nw / nh;
  if (Math.abs(nr - r) / r > 0.08) { it.w = nw; it.h = nh; scheduleLayout(); }
}

/* ───── downloads ───── */
// עם מפתח API – הורדה ישירות מגוגל. בלי מפתח – דרך הסקריפט של גוגל (Code.gs) שכבר מחובר לאתר
const API_KEY = CFG.DRIVE_API_KEY && !/PASTE/.test(CFG.DRIVE_API_KEY) ? CFG.DRIVE_API_KEY : '';
const HAS_KEY = CFG.DIRECT_DOWNLOAD !== false;
const IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const MOBILE = IOS || /Android|Mobi/i.test(navigator.userAgent);
const fileUrl = id => `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media&supportsAllDrives=true&key=${encodeURIComponent(API_KEY)}`;
const MIME = { jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', heic:'image/heic', webp:'image/webp', gif:'image/gif', mp4:'video/mp4', mov:'video/quicktime' };
const mimeOf = n => MIME[(String(n).split('.').pop() || '').toLowerCase()] || 'application/octet-stream';
const fmtMB = b => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : Math.round(b / 1e6) + ' MB';

// ניסיון להוריד ישר מגוגל (מהיר). אם הדפדפן חוסם – עוברים לשרת, וזוכרים את זה לשאר הקבצים
let DIRECT = null;
async function fetchDirect(it) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(`https://drive.usercontent.google.com/download?id=${encodeURIComponent(it.id)}&export=download&confirm=t`, { signal: ctl.signal, credentials: 'omit' });
    clearTimeout(t);
    if (!r.ok || /text\/html/i.test(r.headers.get('content-type') || '')) return null;
    const d = new Uint8Array(await r.arrayBuffer());
    DIRECT = true;
    return d;
  } catch (e) {
    clearTimeout(t);
    if (DIRECT === null && e && e.name === 'TypeError') DIRECT = false;
    return null;
  }
}
async function fetchFile(it, tries) {
  tries = tries || 3;
  for (let a = 1; ; a++) {
    try {
      if (API_KEY) {
        const r = await fetch(fileUrl(it.id));
        if (!r.ok) throw new Error('http ' + r.status);
        return new Uint8Array(await r.arrayBuffer());
      }
      if (DIRECT !== false) { const d = await fetchDirect(it); if (d) return d; }
      const f = await api('getFileData', SLUG, st.token, it.id);
      if (!f || f.error || !f.b64) throw new Error((f && f.error) || 'nodata');
      const r = await fetch('data:application/octet-stream;base64,' + f.b64);
      return new Uint8Array(await r.arrayBuffer());
    } catch (e) {
      if (a >= tries || /toolarge|disabled|badfile/.test(e && e.message)) throw e;
      await new Promise(res => setTimeout(res, 800 * a));
    }
  }
}
function saveBlob(blob, name) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}
// שיתוף קבצים (אייפון: "שמור תמונה" נכנס ישר לגלריה). אם עבר יותר מדי זמן מהלחיצה – מבקשים לחיצה נוספת
async function shareFiles(files, title, sub) {
  const go = async () => { await navigator.share({ files }); return true; };
  try { return await go(); }
  catch (e) {
    if (e && e.name === 'AbortError') return false;
    return new Promise(res => {
      modal(`<h3>${esc(title)}</h3><p>${esc(sub || L.readySub)}</p>
        <div class="row-btns"><button class="btn light" data-close>${esc(L.cancel)}</button><button class="btn" id="shb">${ic('download')}${esc(files.length > 1 ? fmt(L.saveImgs, { n: files.length }) : L.saveImg)}</button></div>`,
        () => { $('#shb').onclick = async () => { closeModal(); try { res(await go()); } catch (e2) { if (!(e2 && e2.name === 'AbortError')) toast(L.dlErr); res(false); } }; },
        () => res(false));
    });
  }
}
const canShareFiles = f => { try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files: f })); } catch (e) { return false; } };

function busy(msg) {
  const t = $('#toast');
  clearTimeout(toastT);
  if (!msg) { t.classList.remove('show', 'busy'); return; }
  t.innerHTML = `<span class="tspin"></span>${esc(msg)}`; t.classList.add('show', 'busy');
}
// במחשב ובאנדרואיד: הורדה מיידית (הקובץ נשמר בהורדות, בלי לפתוח את Drive)
function quickDownload(it) {
  const a = document.createElement('a');
  a.href = dlUrl(it.id); a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
}
async function download(it) {
  api('logDownload', SLUG, st.token, 'file').catch(() => {});
  if (!HAS_KEY) return openUrl(dlUrl(it.id));
  if (!IOS && !API_KEY) { quickDownload(it); toast(L.dlStarted); return; }
  busy(L.preparing);
  let data;
  try { data = await fetchFile(it); }
  catch (e) { busy(false); if (/toolarge/.test(e && e.message)) return openUrl(dlUrl(it.id)); toast(L.dlErr); return; }
  busy(false);
  const name = it.n || (it.id + '.jpg');
  if (IOS) {
    const f = new File([data], name, { type: mimeOf(name) });
    if (canShareFiles([f])) { const ok = await shareFiles([f], L.readyOne); if (ok) toast(L.saved); return; }
  }
  saveBlob(new Blob([data], { type: mimeOf(name) }), name);
}

/* מועדפים בטלפון: באייפון דרך "שמור תמונות" (במנות), באנדרואיד הורדה ישירה של כל קובץ */
async function saveFavsPhone(items) {
  api('logDownload', SLUG, st.token, 'favorites').catch(() => {});
  if (!HAS_KEY) { items.forEach(it => openUrl(dlUrl(it.id))); return; }
  const BATCH = 25;
  for (let start = 0; start < items.length; start += BATCH) {
    const chunk = items.slice(start, start + BATCH);
    const files = [];
    const ui = progressModal(chunk.length);
    for (let i = 0; i < chunk.length && !ui.stopped; i++) {
      try { const d = await fetchFile(chunk[i]); files.push(new File([d], chunk[i].n || chunk[i].id + '.jpg', { type: mimeOf(chunk[i].n) })); ui.add(d.length); }
      catch (e) { ui.add(0); }
    }
    if (ui.stopped) return;
    closeModal();
    if (!files.length) { toast(L.dlErr); return; }
    if (IOS && canShareFiles(files)) {
      const left = items.length - start - chunk.length;
      const ok = await shareFiles(files, L.readyTitle, L.readySub);
      if (!ok) return;
      if (left > 0) {
        const cont = await new Promise(res => modal(`<h3>${esc(L.saved)} ✓</h3><p>${esc(fmt(L.nextBatch, { n: left }))}</p>
          <div class="row-btns"><button class="btn light" data-close>${esc(L.close)}</button><button class="btn" id="nb">${esc(L.cont)}</button></div>`,
          () => { $('#nb').onclick = () => { closeModal(); res(true); }; }, () => res(false)));
        if (!cont) return;
      } else toast(L.saved);
    } else {
      for (const f of files) { saveBlob(f, f.name); await new Promise(r => setTimeout(r, 350)); }
    }
  }
}

function progressModal(total) {
  let n = 0, bytes = 0;
  const ui = { stopped: false, onStop: null };
  modal(`<h3>${esc(L.prepDl)}</h3><div class="prog"><i id="pgb"></i></div><div class="prog-t" id="pgt"></div>
    <div class="row-btns"><button class="btn light" data-close>${esc(L.stop)}</button></div>`, null,
    () => { ui.stopped = true; if (ui.onStop) ui.onStop(); });
  const draw = () => { const b = $('#pgb'), t = $('#pgt'); if (b) b.style.width = (total ? n / total * 100 : 0) + '%'; if (t) t.textContent = fmt(L.progress, { n, m: total, mb: fmtMB(bytes) }); };
  ui.add = b => { n++; bytes += b; draw(); };
  draw();
  return ui;
}

/* ───── ZIP (בלי דחיסה – תמונות JPG ממילא לא מתכווצות) עם תמיכה ב-ZIP64 ───── */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
const U32 = 0xFFFFFFFF;
class ZipOut {

  uniq(name) { let n = name, i = 2; while (this.names.has(n.toLowerCase())) { n = name.replace(/(\.[^.\/]*)?$/, m => ` (${i})` + m); i++; } this.names.add(n.toLowerCase()); return n; }
  async put(u8) { await this.write(u8); this.off += u8.length; }
  async add(name, data) {
    name = this.uniq(name);
    const nb = new TextEncoder().encode(name), crc = crc32(data), off = this.off;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, this.time, true); h.setUint16(12, this.date, true); h.setUint32(14, crc, true);
    h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nb.length, true); h.setUint16(28, 0, true);
    await this.put(new Uint8Array(h.buffer)); await this.put(nb); await this.put(data);
    this.cd.push({ nb, crc, size: data.length, off });
  }
  async finish() {
    const parts = [], cdStart = this.off;
    for (const e of this.cd) {
      const z = e.off >= U32, h = new DataView(new ArrayBuffer(46));
      h.setUint32(0, 0x02014b50, true); h.setUint16(4, 45, true); h.setUint16(6, z ? 45 : 20, true); h.setUint16(8, 0x0800, true); h.setUint16(10, 0, true);
      h.setUint16(12, this.time, true); h.setUint16(14, this.date, true); h.setUint32(16, e.crc, true); h.setUint32(20, e.size, true); h.setUint32(24, e.size, true);
      h.setUint16(28, e.nb.length, true); h.setUint16(30, z ? 12 : 0, true); h.setUint32(42, z ? U32 : e.off, true);
      parts.push(new Uint8Array(h.buffer), e.nb);
      if (z) { const x = new DataView(new ArrayBuffer(12)); x.setUint16(0, 1, true); x.setUint16(2, 8, true); x.setBigUint64(4, BigInt(e.off), true); parts.push(new Uint8Array(x.buffer)); }
    }
    for (const p of parts) await this.put(p);
    const cdEnd = this.off, cdSize = cdEnd - cdStart, n = this.cd.length;
    const z64 = cdStart >= U32 || cdSize >= U32 || n >= 0xFFFF;
    if (z64) {
      const r = new DataView(new ArrayBuffer(56 + 20));
      r.setUint32(0, 0x06064b50, true); r.setBigUint64(4, 44n, true); r.setUint16(12, 45, true); r.setUint16(14, 45, true);
      r.setBigUint64(24, BigInt(n), true); r.setBigUint64(32, BigInt(n), true); r.setBigUint64(40, BigInt(cdSize), true); r.setBigUint64(48, BigInt(cdStart), true);
      r.setUint32(56, 0x07064b50, true); r.setBigUint64(64, BigInt(cdEnd), true); r.setUint32(72, 1, true);
      await this.put(new Uint8Array(r.buffer));
    }
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, z64 ? 0xFFFF : n, true); e.setUint16(10, z64 ? 0xFFFF : n, true);
    e.setUint32(12, z64 ? U32 : cdSize, true); e.setUint32(16, z64 ? U32 : cdStart, true);
    await this.put(new Uint8Array(e.buffer));
  }
}

const zipBase = s => (String(s || 'gallery').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim() || 'gallery').slice(0, 80);
const PART_BYTES = 1.5e9; // בדפדפנים בלי כתיבה ישירה לדיסק – ZIP נפרד לכל ~1.5GB

/* הורדת ZIP במחשב. ב-Chrome/Edge נכתב ישר לדיסק תוך כדי הורדה; בשאר הדפדפנים מתחלק לחלקים */
async function downloadZip(items, label, withFolders) {
  const base = zipBase(label);
  let mode = 'parts', fh = null, writable = null;
  if (window.showSaveFilePicker && window.isSecureContext) {
    try {
      fh = await showSaveFilePicker({ suggestedName: base + '.zip', types: [{ description: 'ZIP', accept: { 'application/zip': ['.zip'] } }] });
      writable = await fh.createWritable(); mode = 'stream';
    } catch (e) { if (e && e.name === 'AbortError') return; mode = 'parts'; }
  }
  api('logDownload', SLUG, st.token, 'all').catch(() => {});
  const ui = progressModal(items.length);
  ui.onStop = () => { if (writable) writable.abort().catch(() => {}); };
  const secName = it => withFolders && st.sections[it.s] && st.sections[it.s].title ? zipBase(st.sections[it.s].title) + '/' : '';
  let zip, chunks = [], partBytes = 0, part = 1, failed = 0;
  const newZip = () => {
    if (mode === 'stream') zip = new ZipOut(u8 => writable.write(u8));
    else { chunks = []; partBytes = 0; zip = new ZipOut(u8 => { chunks.push(u8); partBytes += u8.length; }); }
  };
  const flushPart = async (last) => {
    await zip.finish();
    const name = (last && part === 1) ? base + '.zip' : `${base} - ${part}.zip`;
    saveBlob(new Blob(chunks, { type: 'application/zip' }), name);
    chunks = [];
    if (!last) { toast(fmt(L.dlPart, { n: part })); part++; newZip(); }
  };
  newZip();
  // מורידים 4 קבצים במקביל, כותבים לפי הסדר
  const q = []; let next = 0;
  const pump = () => { if (next < items.length) { const it = items[next++]; q.push(fetchFile(it).then(d => [it, d], () => [it, null])); } };
  for (let k = 0; k < 4; k++) pump();
  try {
    while (q.length) {
      const [it, data] = await q.shift();
      if (ui.stopped) return;
      pump();
      if (!data) { failed++; ui.add(0); continue; }
      await zip.add(secName(it) + (it.n || it.id + '.jpg'), data);
      ui.add(data.length);
      if (mode === 'parts' && partBytes >= PART_BYTES && q.length) await flushPart(false);
    }
    if (ui.stopped) return;
    if (mode === 'stream') { await zip.finish(); await writable.close(); }
    else await flushPart(true);
    closeModal();
    toast(failed ? fmt(L.dlFailed, { n: failed }) : L.dlDone);
  } catch (e) {
    if (ui.stopped) return;
    if (writable) writable.abort().catch(() => {});
    closeModal(); toast(L.dlErr);
  }
}

function downloadAll() {
  if (MOBILE && HAS_KEY) {
    modal(`<h3>${esc(L.dlTitle)}</h3><p>${esc(L.dlPhoneOnly)}</p>
      <div class="row-btns">${st.meta.allowFavorites ? `<button class="btn light" id="gofav">${ic('heart')}${esc(L.favorites)}</button>` : ''}<button class="btn" data-close>${esc(L.close)}</button></div>`,
      () => { const g = $('#gofav'); if (g) g.onclick = () => { closeModal(); setView('favs'); }; });
    return;
  }
  // בלי מפתח API – ההתנהגות הישנה (פתיחת התיקייה בדרייב)
  if (!HAS_KEY) {
    const secs = st.sections.filter(s => s.title && s.folderUrl);
    modal(`<h3>${esc(L.dlTitle)}</h3><p>${esc(L.dlHelp)}</p>
      <div class="dl-list">
        <button class="btn" data-u="${esc(st.folderUrl)}"><span>${esc(L.dlEverything)}</span><span>${st.items.length}</span></button>
        ${secs.map(s => `<button class="btn light" data-u="${esc(s.folderUrl)}"><span>${esc(s.title)}</span><span>${s.items.length}</span></button>`).join('')}
      </div>
      <div class="row-btns"><button class="btn light" data-close>${esc(L.close)}</button></div>`,
      m => m.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { openUrl(b.dataset.u); api('logDownload', SLUG, st.token, 'all').catch(() => {}); }));
    return;
  }
  const secs = st.sections.map((s, i) => ({ s, i })).filter(x => x.s.title && x.s.items.length);
  const stream = !!window.showSaveFilePicker;
  modal(`<h3>${esc(L.dlTitle)}</h3><p>${esc(stream ? L.dlHelp : L.dlHelpParts)}</p>
    <div class="dl-list">
      <button class="btn" data-i="all"><span>${esc(L.dlEverything)}</span><span>${st.items.length}</span></button>
      ${secs.length > 1 ? secs.map(x => `<button class="btn light" data-i="${x.i}"><span>${esc(x.s.title)}</span><span>${x.s.items.length}</span></button>`).join('') : ''}
    </div>
    <div class="row-btns"><button class="btn light" data-close>${esc(L.close)}</button></div>`,
    m => m.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      const all = b.dataset.i === 'all', sec = all ? null : st.sections[+b.dataset.i];
      closeModal();
      downloadZip(all ? st.items : sec.items, all ? st.meta.title : st.meta.title + ' - ' + sec.title, all);
    }));
}

/* ───── share ───── */
async function share() {
  const url = (st.meta && st.meta.shareUrl) || SITE + '?g=' + encodeURIComponent(SLUG);
  if (navigator.share && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ title: st.meta.title, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const ok = await copyText(url);
  toast(ok ? L.copied : url);
}

/* ───── comments ───── */
const myComments = id => st.comments.filter(c => c.fileId === id);
async function commentFor(it) {
  if (!(await ensureName())) return;
  const mine = myComments(it.id);
  modal(`<h3>${esc(L.comment)}</h3>
    ${mine.length ? `<div class="cmt-l">${esc(L.yourComments)}</div>${mine.map(c => `<div class="cmt">${esc(c.text)}</div>`).join('')}` : ''}
    <textarea class="field" id="ct" placeholder="${esc(L.commentPh)}"></textarea>
    <div class="row-btns"><button class="btn light" data-close>${esc(L.cancel)}</button><button class="btn" id="cs">${esc(L.send)}</button></div>`,
    () => {
      setTimeout(() => $('#ct').focus(), 50);
      $('#cs').onclick = async () => {
        const t = $('#ct').value.trim(); if (!t) return;
        const b = $('#cs'); b.disabled = true;
        try {
          await api('addComment', SLUG, st.token, st.visitor, it.id, t);
          st.comments.push({ fileId: it.id, text: t });
          closeModal(); toast(L.commentSent);
          if (st.lb >= 0) lbBottom();
        } catch (e) { b.disabled = false; toast(L.error); }
      };
    });
}

/* ───── lightbox ───── */
function buildLb() {
  const lb = $('#lb');
  lb.innerHTML = `
    <div class="lb-top"><span class="lb-count" id="lbc"></span><span class="lb-name" id="lbn"></span><button class="ibtn" id="lbx" aria-label="${esc(L.close)}">${ic('x')}</button></div>
    <div class="lb-stage" id="lbs"></div>
    ${st.meta.watermark ? '<div class="lb-wm"></div>' : ''}
    <button class="lb-nav lb-l" id="lbl">${ic('chevL')}</button>
    <button class="lb-nav lb-r" id="lbr">${ic('chevR')}</button>
    <div class="lb-bottom" id="lbb"></div>`;
  $('#lbx').onclick = closeLb;
  // כפתור ימין/שמאל לפי כיוון הקריאה: בעברית "הבא" משמאל
  $('#lbr').onclick = () => lbStep(RTL ? -1 : 1);
  $('#lbl').onclick = () => lbStep(RTL ? 1 : -1);
  const stage = $('#lbs');
  let sx = 0, sy = 0, multi = false;
  stage.addEventListener('touchstart', e => { if (e.touches.length > 1) multi = true; else { multi = false; sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (multi || Z.s > 1.01 || Z.wasZoomed) { if (!e.touches.length) multi = false; return; }
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) lbStep(dx < 0 ? (RTL ? -1 : 1) : (RTL ? 1 : -1));
    else if (dy > 110 && Math.abs(dy) > Math.abs(dx) * 1.5) closeLb();
  });
  stage.addEventListener('click', e => { if (e.target === stage && Z.s <= 1.01) closeLb(); });
  initZoom(stage);
}

/* ───── זום בתצוגה המוגדלת: צביטה, לחיצה כפולה, גלגלת, גרירה ───── */
const Z = { s: 1, x: 0, y: 0, img: null, it: null, hi: false, wasZoomed: false, MAX: 5 };
function zApply(anim) {
  const img = Z.img; if (!img) return;
  const st0 = img.parentElement, sw = st0.clientWidth, sh = st0.clientHeight;
  const mx = Math.max(0, (img.offsetWidth * Z.s - sw) / 2), my = Math.max(0, (img.offsetHeight * Z.s - sh) / 2);
  Z.x = Math.min(mx, Math.max(-mx, Z.x)); Z.y = Math.min(my, Math.max(-my, Z.y));
  img.classList.toggle('anim', !!anim);
  img.classList.toggle('zoomed', Z.s > 1.01);
  img.style.transform = Z.s > 1.001 ? `translate(${Z.x}px,${Z.y}px) scale(${Z.s})` : '';
  if (Z.s > 1.2 && !Z.hi && Z.it) {  // טוענים גרסה חדה יותר כשמגדילים
    Z.hi = true; const it = Z.it, big = new Image();
    big.onload = () => { if (Z.it === it && Z.img) Z.img.src = big.src; };
    big.src = thumb(it.id, 4000);
  }
}
function zReset(img, it) { Z.s = 1; Z.x = 0; Z.y = 0; Z.img = img; Z.it = it; Z.hi = false; if (img) zApply(false); }
function zAt(cx, cy, ns, anim) {
  const img = Z.img; if (!img) return;
  const r = img.parentElement.getBoundingClientRect();
  const px = cx - (r.left + r.width / 2), py = cy - (r.top + r.height / 2);
  ns = Math.min(Z.MAX, Math.max(1, ns));
  Z.x = px - (px - Z.x) * ns / Z.s; Z.y = py - (py - Z.y) * ns / Z.s; Z.s = ns;
  if (ns <= 1) { Z.x = 0; Z.y = 0; }
  zApply(anim);
}
function initZoom(stage) {
  const pts = new Map();
  let pinch = null, pan = null, lastType = '', lastTap = 0, lastX = 0, lastY = 0, moved = false;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const mid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  stage.addEventListener('pointerdown', e => {
    if (!Z.img || e.target !== Z.img && pts.size === 0 && Z.s <= 1.01) return;
    lastType = e.pointerType;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    moved = false; Z.wasZoomed = Z.s > 1.01;
    if (pts.size === 2) { const m = mid(); pinch = { d: dist(), s: Z.s, mx: m.x, my: m.y, x: Z.x, y: Z.y }; pan = null; }
    else if (pts.size === 1 && Z.s > 1.01) pan = { x: e.clientX, y: e.clientY, ox: Z.x, oy: Z.y };
  });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId);
    if (Math.hypot(e.clientX - p.x, e.clientY - p.y) > 6) moved = true;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size >= 2) {
      const m = mid(), ns = Math.min(Z.MAX, Math.max(1, pinch.s * dist() / pinch.d));
      const r = stage.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const px = pinch.mx - cx, py = pinch.my - cy;
      Z.x = px - (px - pinch.x) * ns / pinch.s + (m.x - pinch.mx);
      Z.y = py - (py - pinch.y) * ns / pinch.s + (m.y - pinch.my);
      Z.s = ns; zApply(false); Z.wasZoomed = true;
    } else if (pan) { Z.x = pan.ox + e.clientX - pan.x; Z.y = pan.oy + e.clientY - pan.y; zApply(false); }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 1 && Z.s > 1.01) { const p = [...pts.values()][0]; pan = { x: p.x, y: p.y, ox: Z.x, oy: Z.y }; }
    if (pts.size === 0) {
      pan = null;
      if (Z.s < 1.05 && Z.s !== 1) { Z.s = 1; Z.x = 0; Z.y = 0; zApply(true); }
      if (e.type === 'pointerup' && !moved && e.pointerType !== 'mouse') {  // לחיצה כפולה בטלפון
        const now = Date.now();
        if (now - lastTap < 320 && Math.hypot(e.clientX - lastX, e.clientY - lastY) < 30) { zAt(e.clientX, e.clientY, Z.s > 1.01 ? 1 : 2.5, true); lastTap = 0; Z.wasZoomed = true; }
        else { lastTap = now; lastX = e.clientX; lastY = e.clientY; }
      }
      setTimeout(() => { Z.wasZoomed = false; }, 50);
    }
  };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('dblclick', e => { if (Z.img && e.target === Z.img && lastType === 'mouse') zAt(e.clientX, e.clientY, Z.s > 1.01 ? 1 : 2.5, true); });
  stage.addEventListener('wheel', e => { if (!Z.img) return; e.preventDefault(); zAt(e.clientX, e.clientY, Z.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)), false); }, { passive: false });
}
function openLb(it) {
  st.lbList = st.list.slice();
  const i = st.lbList.indexOf(it); if (i < 0) return;
  $('#lb').classList.add('open');
  document.body.style.overflow = 'hidden';
  lbShow(i);
}
function closeLb() {
  zReset(null, null);
  $('#lb').classList.remove('open'); $('#lbs').innerHTML = '';
  document.body.style.overflow = ''; st.lb = -1;
}
function lbStep(d) { if (st.lb >= 0) lbShow(st.lb + d); }
const lbW = () => Math.min(2560, Math.max(1200, Math.ceil(Math.max(innerWidth, innerHeight) * dpr() / 400) * 400));
function lbShow(i) {
  const list = st.lbList; if (!list.length) return closeLb();
  i = (i + list.length) % list.length; st.lb = i;
  const it = list[i], stage = $('#lbs');
  zReset(null, null);
  if (it.v) {
    stage.innerHTML = `<iframe src="https://drive.google.com/file/d/${it.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  } else {
    const img = document.createElement('img'); img.alt = ''; img.draggable = false;
    const lo = it._img && it._img.complete && it._img.naturalWidth ? it._img.src : '';
    if (lo) img.src = lo;
    stage.innerHTML = ''; stage.appendChild(img);
    zReset(img, it);
    const w = lbW(), hi = new Image();
    hi.onload = () => { if (st.lb === i && st.lbList[i] === it && !Z.hi) img.src = hi.src; };
    hi.onerror = () => { if (!hi.dataset.fb) { hi.dataset.fb = '1'; hi.src = thumb2(it.id, w); } };
    hi.src = thumb(it.id, w);
    [1, -1].forEach(d => { const n = list[(i + d + list.length) % list.length]; if (n && !n.v) { const p = new Image(); p.src = thumb(n.id, w); } });
  }
  $('#lbc').textContent = (i + 1) + ' / ' + list.length;
  $('#lbn').textContent = it.n || '';
  lbBottom();
}
function lbBottom() {
  const it = st.lbList[st.lb]; if (!it) return;
  const m = st.meta, fav = st.favs.has(it.id);
  let h = '';
  if (m.allowFavorites) h += `<button class="ibtn ${fav ? 'on' : ''}" id="lbfav">${ic('heart')}<span class="lbl">${esc(fav ? L.unfav : L.fav)}</span></button>`;
  if (m.allowComments) h += `<button class="ibtn" id="lbcom">${ic('comment')}<span class="lbl">${esc(L.comment)}</span>${myComments(it.id).length ? '<span class="dot"></span>' : ''}</button>`;
  if (m.allowDownload) h += `<button class="ibtn" id="lbdl">${ic('download')}<span class="lbl">${esc(L.download)}</span></button>`;
  $('#lbb').innerHTML = h;
  const f = $('#lbfav'); if (f) f.onclick = () => toggleFav(it, f);
  const c = $('#lbcom'); if (c) c.onclick = () => commentFor(it);
  const d = $('#lbdl'); if (d) d.onclick = () => download(it);
}
document.addEventListener('keydown', e => {
  if ($('#modal').classList.contains('open')) { if (e.key === 'Escape') cancelModal(); return; }
  if (st.lb < 0) return;
  if (e.key === 'Escape') closeLb();
  else if (Z.s > 1.01 && /^Arrow/.test(e.key)) return;
  else if (e.key === 'ArrowRight') lbStep(RTL ? -1 : 1);
  else if (e.key === 'ArrowLeft') lbStep(RTL ? 1 : -1);
  else if ((e.key === '+' || e.key === '=') && Z.img) { const r = Z.img.parentElement.getBoundingClientRect(); zAt(r.left + r.width / 2, r.top + r.height / 2, Z.s * 1.5, true); }
  else if (e.key === '-' && Z.img) { const r = Z.img.parentElement.getBoundingClientRect(); zAt(r.left + r.width / 2, r.top + r.height / 2, Z.s / 1.5, true); }
});
document.addEventListener('contextmenu', e => {
  if (document.body.classList.contains('nodl') && e.target.tagName === 'IMG') e.preventDefault();
});

/* ───── חלון המלצה ───── */
function scheduleReview() {
  if (CFG.REVIEWS === false || store.get('grev_done') || store.get('grev_skip_' + SLUG)) return;
  setTimeout(tryReview, (+CFG.REVIEW_DELAY_SEC || 20) * 1000);
}
function tryReview() {
  // לא קופצים באמצע הורדה, הגדלה או חלון אחר
  if ($('#modal').classList.contains('open') || st.lb >= 0 || document.hidden) return setTimeout(tryReview, 5000);
  showReview();
}
function showReview() {
  let rating = 0;
  modal(`<div class="rev"><h3>${esc(L.revTitle)}</h3><p>${esc(L.revSub)}</p>
    <div class="stars" id="rvs">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-label="${n}">${ic('star')}</button>`).join('')}</div>
    <form id="rvf"><input class="field" id="rvn" placeholder="${esc(L.revName)}" value="${esc(st.visitor.name || '')}" autocomplete="name">
    <textarea class="field" id="rvt" placeholder="${esc(L.revPh)}"></textarea>
    <div class="row-btns"><button type="button" class="btn light" data-close>${esc(L.revLater)}</button><button class="btn" type="submit" id="rvb">${esc(L.send)}</button></div></form></div>`,
    m => {
      m.querySelector('.card').classList.add('rev');
      const stars = [...m.querySelectorAll('#rvs button')];
      const paint = k => stars.forEach(b => b.classList.toggle('on', +b.dataset.n <= k));
      stars.forEach(b => {
        b.onclick = () => { rating = +b.dataset.n; paint(rating); };
        b.onmouseenter = () => paint(+b.dataset.n);
        b.onmouseleave = () => paint(rating);
      });
      $('#rvf').onsubmit = async e => {
        e.preventDefault();
        const text = $('#rvt').value.trim(), name = $('#rvn').value.trim();
        if (!text && !rating) { $('#rvt').focus(); return; }
        const b = $('#rvb'); b.disabled = true;
        try {
          const r = await api('addReview', SLUG, st.token, { key: st.visitor.key, name, rating, text });
          if (r && r.error) throw new Error(r.error);
          store.set('grev_done', '1');
          if (name && !st.visitor.name) { st.visitor.name = name; store.set('gvisitor', JSON.stringify(st.visitor)); }
          closeModal(); toast(L.revThanks);
        } catch (err) { b.disabled = false; toast(L.error); }
      };
    },
    () => store.set('grev_skip_' + SLUG, '1'));
}

/* ───── footer ───── */
function footerHtml() {
  const links = [];
  const http = u => /^https?:\/\//i.test(u) ? u : 'https://' + u;
  if (S.phone) links.push(['tel:' + S.phone.replace(/[^\d+]/g, ''), 'phone']);
  if (S.whatsapp) { let n = S.whatsapp.replace(/\D/g, ''); if (n.startsWith('0')) n = '972' + n.slice(1); links.push(['https://wa.me/' + n, 'whatsapp']); }
  if (S.instagram) links.push([/instagram\.com/i.test(S.instagram) ? http(S.instagram) : 'https://instagram.com/' + S.instagram.replace(/^@/, ''), 'instagram']);
  if (S.facebook) links.push([/facebook\.com/i.test(S.facebook) ? http(S.facebook) : 'https://facebook.com/' + S.facebook, 'facebook']);
  if (S.website) links.push([http(S.website), 'globe']);
  if (S.email) links.push(['mailto:' + S.email, 'mail']);
  if (!S.studioName && !logoSrc(64) && !links.length) return '';
  return `${brandHtml()}${S.tagline ? `<div class="tag">${esc(S.tagline)}</div>` : ''}
    ${links.length ? `<div class="links">${links.map(([u, i]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${ic(i)}</a>`).join('')}</div>` : ''}`;
}
